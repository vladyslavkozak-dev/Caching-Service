[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "payload-cache"
version = "0.1.0"
description = "Payload generation service with cached string transformations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
cache-cli = "cache_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/payload_cache", "src/cache_cli"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
